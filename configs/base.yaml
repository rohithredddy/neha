# Mirrors docs/02_METHOD_SPEC.md §7. Change both together.
model:
  name: safedti
  hidden: 128
  heads: 4
  head_dim: 32
  drug_gin_layers: 3
  atom_feat_dim: 74
  esm_model: esm2_t30_150M_UR50D
  esm_dim: 640
  cnn_kernels: [3, 6, 9]
  attention_sink: true
  type_heads: true
  structure: false            # C3 (SAG) deprioritised; off by default
  tau_plddt: 70
  T_plddt: 10
  p_drop_structure: 0.3
  classifier_hidden: [512, 128]
  dropout: 0.2

data:
  N_max: 128
  L_max: 1024
  processed_dir: data/processed

train:
  batch_size: 32
  optimizer: adamw
  lr: 1.0e-4
  lr_stage2: 2.0e-5
  weight_decay: 1.0e-5
  warmup_steps: 500
  epochs: 40
  epochs_stage2: 15
  patience: 8
  grad_clip: 5.0
  amp: true
  grounding_ramp_epochs: 3

loss:
  lambda: {rank: 1.0, type: 0.5, sink: 0.1, cons: 0.5}
  T_rank: 1.0
  T_m: 2.0
  ema_decay: 0.999

eval:
  brhr_k: [1, 3, 5]

seeds: [0, 1, 2, 3, 4]
